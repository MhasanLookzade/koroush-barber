<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1C1D"/>
      <stop offset="100%" stop-color="#121314"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bgBefore)"/>
  
  <!-- Subtle background grid -->
  <g stroke="#2C2E30" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
  </g>

  <!-- Silhouette - Before: Overgrown, flat, unshaped hair -->
  <!-- Shoulders & Torso -->
  <path d="M150 700 C150 540, 210 500, 300 500 C390 500, 450 540, 450 700 Z" fill="#242729"/>
  <!-- Neck -->
  <path d="M255 420 L255 510 L345 510 L345 420 Z" fill="#8C7765"/>
  <!-- Face & Jawline - Soft, unkempt -->
  <path d="M230 310 C230 450, 270 475, 300 475 C330 475, 370 450, 370 310 C370 240, 350 220, 300 220 C250 220, 230 240, 230 310 Z" fill="#A8907A"/>
  <!-- Unkempt overgrown hair (heavy, covering forehead and ears) -->
  <path d="M205 290 C190 220, 220 130, 300 130 C370 130, 415 200, 400 300 C390 320, 370 290, 360 260 C320 270, 260 280, 240 265 C220 280, 210 300, 205 290 Z" fill="#2E241E"/>
  <path d="M195 240 C185 280, 200 340, 225 350 C220 320, 220 270, 210 250 Z" fill="#241C17"/>
  <path d="M405 240 C415 280, 400 340, 375 350 C380 320, 380 270, 390 250 Z" fill="#241C17"/>
  <!-- Unkempt patchy beard -->
  <path d="M230 360 C230 460, 260 485, 300 485 C340 485, 370 460, 370 360 C360 380, 345 390, 340 410 C330 440, 270 440, 260 410 C255 390, 240 380, 230 360 Z" fill="#2E241E" opacity="0.85"/>
  
  <!-- Status Badge -->
  <rect x="40" y="40" width="160" height="42" rx="21" fill="#1C1E20" stroke="#484E53" stroke-width="1.5"/>
  <circle cx="65" cy="61" r="5" fill="#8A9196"/>
  <text x="125" y="67" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="600" fill="#B4BAC0" text-anchor="middle">قبل از پیرایش</text>

  <!-- Bottom subtitle -->
  <text x="300" y="660" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">موهای کدر، بی‌حالت و ریش نامتقارن</text>
</svg>
