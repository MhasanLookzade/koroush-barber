<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B19"/>
      <stop offset="100%" stop-color="#0E100F"/>
    </linearGradient>
    <linearGradient id="goldG6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0"/>
      <stop offset="50%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#9A773F"/>
    </linearGradient>
    <linearGradient id="cardG6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C211E"/>
      <stop offset="100%" stop-color="#111412"/>
    </linearGradient>
    <filter id="glowG6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#g6Bg)"/>

  <!-- Subtle ambient grid -->
  <g stroke="#262C28" stroke-width="0.75" opacity="0.4">
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Glowing halo -->
  <circle cx="300" cy="205" r="140" fill="#C8A96B" opacity="0.08" filter="url(#glowG6)"/>

  <!-- Main Invoice Card Frame -->
  <rect x="155" y="65" width="290" height="280" rx="20" fill="url(#cardG6)" stroke="url(#goldG6)" stroke-width="1.8"/>

  <!-- Invoice Header -->
  <g transform="translate(175, 85)">
    <!-- Price Tag Icon -->
    <path d="M5 15 L15 5 L30 5 L30 20 L20 30 Z" fill="none" stroke="url(#goldG6)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="23" cy="12" r="2" fill="#E4C88E"/>
    <text x="42" y="15" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="700" fill="#F7F4EE">شفافیت تعرفه و بیعانه</text>
    <text x="42" y="28" font-family="Vazirmatn, sans-serif" font-size="10" fill="#8C8477">تضمین عدم دریافت وجه مازاد در سالن</text>
  </g>

  <!-- Separator Line -->
  <line x1="175" y1="125" x2="425" y2="125" stroke="#2B332E" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Line Item 1: Service Name -->
  <g transform="translate(175, 145)">
    <text x="0" y="0" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="600" fill="#F7F4EE">اصلاح کامل مو و صورت</text>
    <text x="250" y="0" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" fill="#F7F4EE" text-anchor="end">۱,۰۰۰,۰۰۰ تومان</text>
  </g>

  <!-- Line Item 2: Required Deposit (20%) -->
  <g transform="translate(175, 185)">
    <rect x="0" y="-14" width="250" height="36" rx="10" fill="#252F29" stroke="#C8A96B" stroke-width="1.2"/>
    <circle cx="15" cy="4" r="3" fill="#E4C88E"/>
    <text x="26" y="8" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" fill="#E4C88E">بیعانه آنلاین (۲۰٪):</text>
    <text x="240" y="8" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="800" fill="#E4C88E" text-anchor="end">۲۰۰,۰۰۰ تومان</text>
  </g>

  <!-- Line Item 3: Balance Due In-Salon -->
  <g transform="translate(175, 235)">
    <text x="0" y="0" font-family="Vazirmatn, sans-serif" font-size="11" fill="#A89E90">مانده پرداخت در سالن (۸۰٪):</text>
    <text x="250" y="0" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" fill="#C5BDB2" text-anchor="end">۸۰۰,۰۰۰ تومان</text>
  </g>

  <!-- Trust Guarantee Stamp / Shield -->
  <g transform="translate(185, 268)">
    <rect x="0" y="0" width="230" height="42" rx="12" fill="#151A17" stroke="url(#goldG6)" stroke-width="1.2"/>
    <path d="M22 10 L32 10 C32 20 22 26 22 26 C22 26 12 20 12 10 Z" fill="none" stroke="url(#goldG6)" stroke-width="1.5"/>
    <path d="M18 17 L21 20 L26 14" fill="none" stroke="#E4C88E" stroke-width="1.5" stroke-linecap="round"/>
    <text x="40" y="24" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" fill="#E4C88E">تسویه نهایی پس از رضایت کامل</text>
  </g>

  <!-- Bottom Subtitle -->
  <text x="300" y="415" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="700" fill="#E4C88E" text-anchor="middle">شفافیت کامل تعرفه‌ها و بیعانه سالن</text>
</svg>
