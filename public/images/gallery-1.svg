<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D1B"/>
      <stop offset="100%" stop-color="#0E100F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C88E"/>
      <stop offset="100%" stop-color="#9A773F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g1)"/>
  <!-- Mirror & Station -->
  <rect x="180" y="40" width="240" height="320" rx="120" fill="#141715" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="300" cy="180" r="100" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <!-- Tufted leather chair hint -->
  <path d="M250 360 L350 360 L330 250 L270 250 Z" fill="#242826" stroke="url(#gold)" stroke-width="1"/>
  <!-- Warm pendant light -->
  <line x1="300" y1="0" x2="300" y2="40" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="300" cy="45" r="8" fill="#FCD34D"/>
  <circle cx="300" cy="45" r="25" fill="#FCD34D" opacity="0.15"/>
  <text x="300" y="415" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="600" fill="#E4C88E" text-anchor="middle">جایگاه اختصاصی پیرایش VIP</text>
</svg>
