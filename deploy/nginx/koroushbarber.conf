# ==============================================================================
# Koroush Barber — Production Nginx Reverse Proxy Configuration
# Canonical Domain: https://koroushbarber.ir
# Secondary Domain: https://www.koroushbarber.ir (Redirects to Canonical)
# Upstream: Next.js Standalone Application (127.0.0.1:3000)
# ==============================================================================

# Edge Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_otp_limit:10m rate=10r/m;

# Upstream definition for Next.js application
upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# Handles ACME Let's Encrypt challenges and redirects all traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name koroushbarber.ir www.koroushbarber.ir;

    # ACME Challenge Directory for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP requests to Canonical HTTPS
    location / {
        return 301 https://koroushbarber.ir$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Secondary Domain Redirect (HTTPS Port 443 www -> non-www)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.koroushbarber.ir;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/koroushbarber.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koroushbarber.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/koroushbarber.ir/chain.pem;

    # Redirect www to canonical non-www
    return 301 https://koroushbarber.ir$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Canonical HTTPS Production Server (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name koroushbarber.ir;

    # --------------------------------------------------------------------------
    # SSL / TLS Hardening (Mozilla Modern / Intermediate Guidelines)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/koroushbarber.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koroushbarber.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/koroushbarber.ir/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Request Body Size Limit (Appropriate for profile images & receipt uploads)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Logging
    access_log /var/log/nginx/koroushbarber.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/koroushbarber.error.log warn;

    # --------------------------------------------------------------------------
    # Static Assets Caching (Next.js Built Assets)
    # Never cache dynamic API, customer info, or admin pages!
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Long-term cache for immutable hashed assets (preserve server security headers)
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
    }

    # Public static images, fonts, and favicon
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
    }

    # Stricter rate limit for OTP and auth endpoints
    location ~ ^/api/(booking/otp/|admin/auth/|auth/) {
        limit_req zone=auth_otp_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Rate limit general API traffic
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ACME Challenge verification for renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Dynamic Reverse Proxy (All Other Pages, APIs & SSR)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket and Connection Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for low-latency live booking sync
        proxy_buffering off;

        # Do not cache sensitive dynamic customer and admin endpoints
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }
}
