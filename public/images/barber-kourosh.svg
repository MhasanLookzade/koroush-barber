<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E1C"/>
      <stop offset="100%" stop-color="#0E100F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C88E"/>
      <stop offset="100%" stop-color="#9A773F"/>
    </linearGradient>
    <radialGradient id="kbGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C8A96B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0E100F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="650" rx="20" fill="url(#kbBg)"/>
  <circle cx="250" cy="240" r="200" fill="url(#kbGlow)"/>
  <!-- Master Barber Stylized Silhouette with Shears & Leather Apron -->
  <path d="M120 650 C120 480, 170 440, 250 440 C330 440, 380 480, 380 650 Z" fill="#202522"/>
  <!-- Apron -->
  <path d="M190 470 L310 470 L330 650 L170 650 Z" fill="#362B22" stroke="url(#gold)" stroke-width="1"/>
  <line x1="210" y1="470" x2="180" y2="440" stroke="url(#gold)" stroke-width="2"/>
  <line x1="290" y1="470" x2="320" y2="440" stroke="url(#gold)" stroke-width="2"/>
  <!-- Head & Hair -->
  <circle cx="250" cy="270" r="70" fill="#B59E8A"/>
  <path d="M190 260 C185 180, 230 160, 260 160 C300 160, 320 190, 310 260 Z" fill="#1C1713"/>
  <!-- Groomed Beard -->
  <path d="M200 280 C200 370, 230 390, 250 390 C270 390, 300 370, 300 280 Z" fill="#1C1713"/>
  <!-- Gold Shears in Hand -->
  <g transform="translate(330, 420) rotate(-15)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#gold)" stroke-width="3"/>
    <line x1="15" y1="15" x2="80" y2="0" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="15" cy="15" r="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <!-- Frame & Name -->
  <rect x="20" y="20" width="460" height="610" rx="16" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
  <text x="250" y="580" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" fill="#E4C88E" text-anchor="middle">استاد کوروش</text>
  <text x="250" y="610" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="500" fill="#A89E90" text-anchor="middle">مدیر و آرایشگر ارشد • ۱۵ سال سابقه حرفه‌ای</text>
</svg>
