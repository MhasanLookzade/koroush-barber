<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B19"/>
      <stop offset="100%" stop-color="#0E100F"/>
    </linearGradient>
    <linearGradient id="goldG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0"/>
      <stop offset="50%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#9A773F"/>
    </linearGradient>
    <linearGradient id="cardG4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D221F"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
    <filter id="glowG4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#g4Bg)"/>

  <!-- Subtle ambient grid -->
  <g stroke="#262C28" stroke-width="0.75" opacity="0.4">
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Glowing halo -->
  <circle cx="300" cy="205" r="140" fill="#C8A96B" opacity="0.08" filter="url(#glowG4)"/>

  <!-- Main Calendar Card Frame -->
  <rect x="155" y="65" width="290" height="280" rx="20" fill="url(#cardG4)" stroke="url(#goldG4)" stroke-width="1.8"/>

  <!-- Calendar Card Header -->
  <rect x="155" y="65" width="290" height="60" rx="20" fill="#252D28" stroke="url(#goldG4)" stroke-width="1.8"/>
  <rect x="155" y="105" width="290" height="20" fill="#252D28"/> <!-- Cover bottom rounded corners of header -->
  <line x1="155" y1="125" x2="445" y2="125" stroke="#37433B" stroke-width="1"/>

  <!-- Header Calendar Icon & Month Title -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="24" height="22" rx="4" fill="none" stroke="url(#goldG4)" stroke-width="1.8"/>
    <line x1="6" y1="-3" x2="6" y2="2" stroke="url(#goldG4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="-3" x2="18" y2="2" stroke="url(#goldG4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="24" y2="7" stroke="url(#goldG4)" stroke-width="1.2"/>
    <circle cx="12" cy="14" r="1.5" fill="#E4C88E"/>
  </g>
  <text x="215" y="102" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="700" fill="#F7F4EE">انتخاب روز و ساعت نوبت</text>
  <rect x="375" y="85" width="55" height="22" rx="11" fill="#C8A96B" fill-opacity="0.2" stroke="#C8A96B" stroke-width="1"/>
  <text x="402" y="100" font-family="Vazirmatn, sans-serif" font-size="10" font-weight="700" fill="#E4C88E" text-anchor="middle">۲۴/۷ فعال</text>

  <!-- 7-Day Mini Strip in Card -->
  <g transform="translate(175, 140)">
    <!-- Day 1 (Passed) -->
    <rect x="0" y="0" width="32" height="42" rx="8" fill="#141715" stroke="#2B332E" stroke-width="1"/>
    <text x="16" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">شن</text>
    <text x="16" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">21</text>

    <!-- Day 2 (Passed) -->
    <rect x="36" y="0" width="32" height="42" rx="8" fill="#141715" stroke="#2B332E" stroke-width="1"/>
    <text x="52" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">یک</text>
    <text x="52" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">22</text>

    <!-- Day 3 (Passed) -->
    <rect x="72" y="0" width="32" height="42" rx="8" fill="#141715" stroke="#2B332E" stroke-width="1"/>
    <text x="88" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">دو</text>
    <text x="88" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">23</text>

    <!-- Day 4 (Closed) -->
    <rect x="108" y="0" width="32" height="42" rx="8" fill="#1A1515" stroke="#482E2E" stroke-width="1"/>
    <text x="124" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#D67575" text-anchor="middle">سه</text>
    <text x="124" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#D67575" text-anchor="middle">24</text>

    <!-- Day 5 (SELECTED - Gold Highlight) -->
    <rect x="144" y="-3" width="36" height="48" rx="10" fill="#2C352E" stroke="url(#goldG4)" stroke-width="1.8" filter="url(#glowG4)"/>
    <text x="162" y="15" font-family="Vazirmatn, sans-serif" font-size="9" font-weight="700" fill="#E4C88E" text-anchor="middle">چهار</text>
    <text x="162" y="34" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#F7F4EE" text-anchor="middle">25</text>

    <!-- Day 6 (Open) -->
    <rect x="184" y="0" width="32" height="42" rx="8" fill="#161B18" stroke="#313B34" stroke-width="1"/>
    <text x="200" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#A89E90" text-anchor="middle">پنج</text>
    <text x="200" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#F7F4EE" text-anchor="middle">26</text>

    <!-- Day 7 (Open) -->
    <rect x="220" y="0" width="32" height="42" rx="8" fill="#161B18" stroke="#313B34" stroke-width="1"/>
    <text x="236" y="16" font-family="Vazirmatn, sans-serif" font-size="9" fill="#A89E90" text-anchor="middle">جم</text>
    <text x="236" y="32" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" fill="#F7F4EE" text-anchor="middle">27</text>
  </g>

  <!-- Time Slots Selector Section -->
  <g transform="translate(175, 205)">
    <!-- Slot 1 (Selected) -->
    <rect x="0" y="0" width="76" height="34" rx="8" fill="#2E3831" stroke="url(#goldG4)" stroke-width="1.5"/>
    <circle cx="14" cy="17" r="4" fill="#C8A96B"/>
    <text x="46" y="22" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="#F7F4EE" text-anchor="middle">16:00</text>

    <!-- Slot 2 -->
    <rect x="88" y="0" width="76" height="34" rx="8" fill="#161A18" stroke="#2B332F" stroke-width="1"/>
    <text x="126" y="22" font-family="Montserrat, sans-serif" font-size="12" font-weight="600" fill="#C5BDB2" text-anchor="middle">17:00</text>

    <!-- Slot 3 -->
    <rect x="176" y="0" width="76" height="34" rx="8" fill="#161A18" stroke="#2B332F" stroke-width="1"/>
    <text x="214" y="22" font-family="Montserrat, sans-serif" font-size="12" font-weight="600" fill="#C5BDB2" text-anchor="middle">18:00</text>
  </g>

  <!-- Confirmation Pill / Instant Booking Badge -->
  <g transform="translate(185, 260)">
    <rect x="0" y="0" width="230" height="40" rx="12" fill="url(#goldG4)"/>
    <path d="M70 20 L78 27 L95 13" fill="none" stroke="#0D0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="25" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="800" fill="#0D0F0E" text-anchor="middle">تأیید فوری و پرداخت بیعانه</text>
  </g>

  <!-- Bottom Subtitle -->
  <text x="300" y="415" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="700" fill="#E4C88E" text-anchor="middle">رزرو آنلاین سریع و ۲۴ ساعته نوبت</text>
</svg>
